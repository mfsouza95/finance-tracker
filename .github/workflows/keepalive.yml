name: Keepalive

# Supabase free projects pause after ~7 days of inactivity. A tiny
# authenticated API call every few days keeps the project alive.
on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL secret is missing or empty"
            exit 1
          fi
          if [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::SUPABASE_PUBLISHABLE_KEY secret is missing or empty"
            exit 1
          fi
          # Query a real table: the /rest/v1/ root spec endpoint rejects
          # publishable keys, but RLS-scoped table reads return 200.
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            "${SUPABASE_URL%/}/rest/v1/profiles?select=user_id&limit=1")
          echo "HTTP $code"
          case "$code" in
            2*) ;;
            *) echo "::error::Ping failed with HTTP $code"; exit 1 ;;
          esac
